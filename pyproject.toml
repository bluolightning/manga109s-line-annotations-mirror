[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga109s-line-annotations"
version = "1.0.0"
description = "Manga109-s text line annotations and dataset conversion utilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pillow>=9.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
]

[project.scripts]
manga109-lines = "build_dataset:main"
